name: Diagnostic ponctuel - paramètres GRIB2 MFWAM

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Télécharger un fichier SP1 et lister ses messages
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://www.data.gouv.fr/api/1/datasets/paquets-de-modele-de-vagues-mfwam-resolution-0-025deg/"
          with urllib.request.urlopen(url) as response:
              data = json.load(response)
          resource = next(r for r in data["resources"] if "011H" in r["title"])
          print("Fichier :", resource["title"])
          urllib.request.urlretrieve(resource["url"], "sample.grib2")
          PY
          python scripts/debug_list_params.py sample.grib2
