name: Mise à jour MFWAM France

on:
  workflow_dispatch:
  schedule:
    - cron: "40 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: update-mfwam-france
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Produire les cartes MFWAM
        id: build
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if python scripts/update_mfwam_france.py \
              --output-dir build/national \
              --current-metadata-url \
              "https://raw.githubusercontent.com/${{ github.repository }}/data/index.json" 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done
          if test -f build/national/index.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle publication MFWAM complète à envoyer."
          fi

      - name: Vérifier la publication
        if: steps.build.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/national")
          index = json.loads((root / "index.json").read_text(encoding="utf-8"))
          maps = json.loads((root / "maps/index.json").read_text(encoding="utf-8"))
          assert index["status"] == "ok"
          assert len(maps["layers"]) >= 11
          assert len(maps["steps"]) >= 24
          print(
              f"Validation OK : {len(maps['layers'])} couches, "
              f"{len(maps['steps'])} échéances"
          )
          PY

      - name: Publier la branche data
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          publish_dir="$(mktemp -d)"
          cp -a build/national/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Données MFWAM $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push --force origin data
